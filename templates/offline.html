<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#006a4d">
  <title>You're offline · CSU Viking Hub</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
           background: #eef3f0; color: #14291f; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { max-width: 360px; width: 100%; padding: 28px 24px; text-align: center; background: #fff;
            border: 1px solid #d6e2db; border-radius: 16px; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { margin: 16px 0 6px; font-size: 1.3rem; }
    p { margin: 0 0 20px; color: #4d6258; line-height: 1.5; }
    .retry { display: inline-block; font-weight: 600; color: #fff; background: #006a4d; border-radius: 10px;
             padding: 11px 20px; text-decoration: none; }
    .retry:hover { background: #00523b; }
    .retry:focus-visible { outline: 3px solid #69be28; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <img src="{{ url_for('static', filename='images/app/icon-192.png') }}" alt="">
    <h1>You're offline</h1>
    <p>Viking Hub needs an internet connection. Check your Wi-Fi or data, then try again.</p>
    <a class="retry" href="">Try again</a>
  </main>
</body>
</html>
