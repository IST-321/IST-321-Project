{# Small line icons. Use: {% from "_icons.html" import icon %}  {{ icon("calendar") }} #}
{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {%- if name == "calendar" %}
  <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
  {%- elif name == "calendar-x" %}
  <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M10 13.5l4 4M14 13.5l-4 4"/>
  {%- elif name == "checklist" %}
  <path d="M10 6h10M10 12h10M10 18h10M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17"/>
  {%- elif name == "card" %}
  <rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19M6 15h4"/>
  {%- elif name == "clipboard" %}
  <rect x="5" y="4.5" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM9 12h6M9 16h4"/>
  {%- elif name == "arrow-left" %}
  <path d="M19 12H5M11 6l-6 6 6 6"/>
  {%- elif name == "chevron-left" %}
  <path d="M15 6l-6 6 6 6"/>
  {%- elif name == "chevron-right" %}
  <path d="M9 6l6 6-6 6"/>
  {%- elif name == "x" %}
  <path d="M6 6l12 12M18 6L6 18"/>
  {%- elif name == "plus" %}
  <path d="M12 5v14M5 12h14"/>
  {%- elif name == "plus-circle" %}
  <circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>
  {%- elif name == "pencil" %}
  <path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>
  {%- elif name == "sync" %}
  <path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/>
  {%- elif name == "check-circle" %}
  <circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>
  {%- elif name == "circle" %}
  <circle cx="12" cy="12" r="9"/>
  {%- elif name == "clock" %}
  <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {%- elif name == "user" %}
  <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
  {%- elif name == "pin" %}
  <path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>
  {%- elif name == "bag" %}
  <path d="M5 8h14l-1 12H6L5 8zM9 8V6a3 3 0 0 1 6 0v2"/>
  {%- elif name == "fork" %}
  <path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10M17 21V3c-2.2 1.2-3.5 3.7-3.5 7v3H17"/>
  {%- elif name == "home" %}
  <path d="M4 11l8-7 8 7M6 10v10h12V10"/>
  {%- endif %}
</svg>
{%- endmacro %}
